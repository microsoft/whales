[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whales"
dynamic = ["version"]
description = "An active learning pipeline for identifying whales in high-resolution satellite imagery."
readme = "README.md"
# Fiona 1.10.1 has no Python 3.14 wheels, and source builds require GDAL development files.
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Caleb Robinson", email = "calebrob6@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fiona",
    "imageio",
    "numpy",
    "opencv-python",
    "pandas",
    "pytz",
    "rasterio",
    "shapely",
    "timezonefinder>=8.3.0",
    "torch",
    "tqdm",
    "utm",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "twine",
]

[project.scripts]
summarize-filtered-points = "utilities.summarize_filtered_points:cli"
filter-interesting-points = "utilities.filter_interesting_points:cli"
generate-interesting-points = "utilities.generate_interesting_points:cli"

[project.urls]
Homepage = "https://github.com/microsoft/whales"
Issues = "https://github.com/microsoft/whales/issues"

[tool.setuptools.dynamic]
version = { attr = "whales.__version__" }

[tool.setuptools.packages.find]
include = ["utilities*", "whales*"]
