name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade ".[dev]"
      - name: Run tests
        run: python -m pytest -q tests

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade build pytest twine
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Test the built wheel
        shell: bash
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install pytest
          .package-venv/bin/python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.package-venv/bin/python" -m pytest \
            "$GITHUB_WORKSPACE/tests/test_packaging.py"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
