name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.11"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade ".[dev]"
      - name: Run tests
        run: python -m pytest -q tests
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Test the built wheel
        shell: bash
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install pytest
          .package-venv/bin/python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.package-venv/bin/python" -m pytest \
            "$GITHUB_WORKSPACE/tests/test_packaging.py"
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
